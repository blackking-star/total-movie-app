<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETFLIX - Total Movie Series</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            background-color: #141414;
            color: #ffffff;
            padding: 0;
            overflow-x: hidden;
        }
        /* Netflix Navbar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0));
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }
        .logo {
            color: #E50914;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .nav-title {
            color: #e5e7eb;
            font-size: 14px;
            font-weight: 500;
        }

        .container {
            max-width: 1400px;
            margin: 90px auto 40px auto;
            padding: 0 20px;
        }

        /* Netflix Hero Player */
        .player-container {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            border: 1px solid #262626;
            margin-bottom: 40px;
        }
        video {
            width: 100%;
            max-height: 520px;
            background: #000;
            display: block;
        }
        .now-playing {
            padding: 18px 25px;
            background: #1f1f1f;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #333;
        }
        .now-playing span {
            color: #E50914;
        }

        /* Section Headings */
        .section-title {
            font-size: 22px;
            color: #fff;
            margin: 30px 0 15px 0;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Movie Row / Grid */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .movie-box {
            background: #1f1f1f;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .movie-box:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(229, 9, 20, 0.4);
            border-color: #E50914;
            z-index: 10;
        }
        .movie-poster {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, #262626, #0f0f0f);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            color: #E50914;
            font-size: 45px;
        }
        .play-overlay {
            position: absolute;
            background: rgba(229, 9, 20, 0.9);
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: scale(0.8);
            font-size: 20px;
        }
        .movie-box:hover .play-overlay {
            opacity: 1;
            transform: scale(1);
        }
        .movie-info {
            padding: 12px;
            font-size: 13px;
            color: #e5e7eb;
            line-height: 1.4;
            word-break: break-word;
            flex-grow: 1;
            font-weight: 500;
        }
        .movie-footer {
            padding: 8px 12px;
            background: #181818;
            text-align: center;
            font-size: 12px;
            color: #E50914;
            font-weight: 700;
        }
        .loading {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: #9ca3af;
            font-size: 16px;
        }
        .empty-history {
            color: #777;
            font-size: 14px;
            font-style: italic;
            grid-column: 1 / -1;
            padding: 10px 0;
        }

        @media (max-width: 768px) {
            .navbar { padding: 15px 20px; }
            .logo { font-size: 22px; }
        }
    </style>
</head>
<body>

    <!-- Netflix Header -->
    <div class="navbar">
        <div class="logo">NETFLIX</div>
        <div class="nav-title">Total Movie Series</div>
    </div>

    <div class="container">
        <!-- Hero Video Player -->
        <div class="player-container">
            <video id="videoPlayer" controls autoplay playsinline preload="metadata">
                আপনার ব্রাউজার ভিডিও ট্যাগ সাপোর্ট করছে না।
            </video>
            <div class="now-playing">
                <span id="currentTitle">প্লে করার জন্য নিচের যেকোনো মুভি সিলেক্ট করুন</span>
            </div>
        </div>

        <!-- Watch History Row -->
        <h3 class="section-title">⏱️ কন্টিনিউ ওয়াচিং (Continue Watching)</h3>
        <div class="movie-grid" id="historyGrid">
            <div class="empty-history" id="emptyHistoryMsg">এখনো কোনো মুভি দেখা হয়নি।</div>
        </div>

        <!-- All Movies Row -->
        <h3 class="section-title">🔥 ট্রেন্ডিং ও সকল মুভি ও সিরিজ</h3>
        <div class="movie-grid" id="movieGrid">
            <div class="loading">মুভি লোড হচ্ছে, দয়া করে অপেক্ষা করুন...</div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://total-movie-backend.onrender.com";
        const CHANNEL_USERNAME = "total_movie_series";

        async function loadMovies() {
            const grid = document.getElementById('movieGrid');
            try {
                const response = await fetch(`${BACKEND_URL}/api/movies/${CHANNEL_USERNAME}`);
                const movies = await response.json();

                if (movies.error) {
                    grid.innerHTML = `<div class="loading" style="color:#e50914;">ত্রুটি: ${movies.error}</div>`;
                    return;
                }

                if (movies.length === 0) {
                    grid.innerHTML = `<div class="loading">কোনো ভিডিও পাওয়া যায়নি!</div>`;
                    return;
                }

                renderMovieList(movies, grid);
                renderHistory();
            } catch (err) {
                grid.innerHTML = `<div class="loading" style="color:#e50914;">সার্ভার কানেক্ট করতে সমস্যা হচ্ছে!</div>`;
            }
        }

        function renderMovieList(movies, container) {
            container.innerHTML = '';
            movies.forEach(movie => {
                const box = createMovieBox(movie);
                container.appendChild(box);
            });
        }

        function createMovieBox(movie) {
            const box = document.createElement('div');
            box.className = 'movie-box';
            box.innerHTML = `
                <div class="movie-poster">
                    🎬
                    <div class="play-overlay">▶</div>
                </div>
                <div class="movie-info">${movie.title}</div>
                <div class="movie-footer">▶ প্লে করুন</div>
            `;
            box.onclick = () => playMovie(movie.id, movie.title);
            return box;
        }

        function playMovie(msgId, title) {
            document.getElementById('currentTitle').innerHTML = `প্লে হচ্ছে: <span>${title}</span>`;
            const video = document.getElementById('videoPlayer');
            
            const streamUrl = `${BACKEND_URL}/stream/${CHANNEL_USERNAME}/${msgId}`;
            
            video.src = streamUrl;
            video.load();
            
            video.play().catch(e => {
                console.log("Auto-play restricted:", e);
            });
            
            saveToHistory(msgId, title);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function saveToHistory(msgId, title) {
            let history = JSON.parse(localStorage.getItem('netflix_history') || '[]');
            history = history.filter(item => item.id !== msgId);
            history.unshift({ id: msgId, title: title });
            if (history.length > 8) history.pop();
            localStorage.setItem('netflix_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const historyGrid = document.getElementById('historyGrid');
            let history = JSON.parse(localStorage.getItem('netflix_history') || '[]');

            if (history.length === 0) {
                historyGrid.innerHTML = `<div class="empty-history" id="emptyHistoryMsg">আপনার হিস্ট্রি খালি। নিচের লিস্ট থেকে মুভি দেখতে শুরু করুন।</div>`;
                return;
            }

            historyGrid.innerHTML = '';
            history.forEach(movie => {
                const box = createMovieBox(movie);
                historyGrid.appendChild(box);
            });
        }

        loadMovies();
    </script>
</body>
</html>
