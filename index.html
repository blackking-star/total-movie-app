<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total Movie Series - Player</title>
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #e50914;
            font-size: 28px;
            margin-bottom: 5px;
        }
        .header p {
            color: #8b949e;
            font-size: 14px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #161b22;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .player-wrapper {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        .controls-input {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"], input[type="number"] {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        input[type="text"] { flex: 2; }
        input[type="number"] { flex: 1; }
        button {
            padding: 12px 20px;
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #b80710;
        }
        @media (max-width: 600px) {
            .input-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Total Movie Series</h1>
        <p>টেলিগ্রাম ভিডিও স্ট্রিমিং প্লেয়ার</p>
    </div>

    <div class="container">
        <!-- Video Player -->
        <div class="player-wrapper">
            <video id="player" playsinline controls>
                <source id="videoSource" src="" type="video/mp4" />
            </video>
        </div>

        <!-- Dynamic Video Controller -->
        <div class="controls-input">
            <h3>ভিডিও চালান (Manual Test)</h3>
            <div class="input-group">
                <input type="text" id="channelInput" placeholder="টেলিগ্রাম চ্যানেল ইউজারনেম (e.g. my_channel)" />
                <input type="number" id="msgIdInput" placeholder="মেসেজ আইডি (e.g. 10)" />
                <button onclick="playVideo()">প্লে করুন</button>
            </div>
        </div>
    </div>

    <!-- Plyr JS -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        const BACKEND_URL = "https://total-movie-backend.onrender.com";
        const player = new Plyr('#player', {
            controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'fullscreen']
        });

        function playVideo() {
            const channel = document.getElementById('channelInput').value.trim().replace('@', '');
            const msgId = document.getElementById('msgIdInput').value.trim();

            if (!channel || !msgId) {
                alert('দয়া করে চ্যানেল ইউজারনেম এবং মেসেজ আইডি দুটিই দিন!');
                return;
            }

            const streamUrl = `${BACKEND_URL}/stream/${channel}/${msgId}`;
            
            // Set new video source
            player.source = {
                type: 'video',
                sources: [
                    {
                        src: streamUrl,
                        type: 'video/mp4',
                    },
                ],
            };

            player.play();
        }
    </script>
</body>
</html>
