<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total Movie Series - Professional Movie Box</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #080c14;
            color: #ffffff;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 15px;
        }
        .header h1 {
            color: #e50914;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .header p {
            color: #9ca3af;
            font-size: 14px;
        }
        .main-layout {
            max-width: 1200px;
            margin: 0 auto;
        }
        /* Video Player Section */
        .player-container {
            background: #111827;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #1f2937;
            margin-bottom: 30px;
        }
        video {
            width: 100%;
            max-height: 480px;
            background: #000;
            display: block;
        }
        .now-playing {
            padding: 15px 20px;
            background: #1f2937;
            font-size: 15px;
            font-weight: 600;
            color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #374151;
        }
        .now-playing span {
            color: #e50914;
        }
        /* Section Titles */
        .section-title {
            font-size: 20px;
            color: #ffffff;
            border-left: 5px solid #e50914;
            padding-left: 12px;
            margin: 25px 0 15px 0;
            font-weight: 600;
        }
        /* Movie Grid & Box Style */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .movie-box {
            background: #111827;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        .movie-box:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(229, 9, 20, 0.35);
            border-color: #e50914;
        }
        .movie-poster {
            width: 100%;
            height: 140px;
            background: linear-gradient(135deg, #1f2937, #0b0f19);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            color: #e50914;
            font-size: 42px;
        }
        .play-overlay {
            position: absolute;
            background: rgba(229, 9, 20, 0.9);
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: scale(0.8);
            font-size: 18px;
        }
        .movie-box:hover .play-overlay {
            opacity: 1;
            transform: scale(1);
        }
        .movie-info {
            padding: 12px;
            font-size: 14px;
            color: #e5e7eb;
            line-height: 1.4;
            word-break: break-word;
            flex-grow: 1;
            font-weight: 500;
        }
        .movie-footer {
            padding: 8px 12px;
            background: #1f2937;
            text-align: center;
            font-size: 12px;
            color: #f87171;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .loading {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: #9ca3af;
            font-size: 15px;
        }
        .empty-history {
            color: #6b7280;
            font-size: 13px;
            font-style: italic;
            grid-column: 1 / -1;
            padding: 10px 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Total Movie Series</h1>
        <p>প্রিমিয়াম মুভি বক্স ও অটো স্ট্রিমিং পোর্টাল</p>
    </div>

    <div class="main-layout">
        <!-- Video Player Section -->
        <div class="player-container">
            <video id="videoPlayer" controls autoplay playsinline>
                <source id="videoSource" src="" type="video/mp4">
                আপনার ব্রাউজার ভিডিও ট্যাগ সাপোর্ট করছে না।
            </video>
            <div class="now-playing">
                <span id="currentTitle">প্লে করার জন্য নিচের যেকোনো মুভি বক্সে ক্লিক করুন</span>
            </div>
        </div>

        <!-- Watch History Section -->
        <h3 class="section-title">⏱️ সম্প্রতি দেখা মুভি (Watch History)</h3>
        <div class="movie-grid" id="historyGrid">
            <div class="empty-history" id="emptyHistoryMsg">এখনো কোনো মুভি দেখা হয়নি।</div>
        </div>

        <!-- All Movies Box Section -->
        <h3 class="section-title">🎬 সকল মুভি ও সিরিজ বক্স</h3>
        <div class="movie-grid" id="movieGrid">
            <div class="loading">মুভি বক্স লোড হচ্ছে, দয়া করে অপেক্ষা করুন...</div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://total-movie-backend.onrender.com";
        const CHANNEL_USERNAME = "total_movie_series";

        let allMovies = [];

        async function loadMovies() {
            const grid = document.getElementById('movieGrid');
            try {
                const response = await fetch(`${BACKEND_URL}/api/movies/${CHANNEL_USERNAME}`);
                const movies = await response.json();

                if (movies.error) {
                    grid.innerHTML = `<div class="loading" style="color:#f87171;">ত্রুটি: ${movies.error}</div>`;
                    return;
                }

                if (movies.length === 0) {
                    grid.innerHTML = `<div class="loading">কোনো ভিডিও পাওয়া যায়নি!</div>`;
                    return;
                }

                allMovies = movies;
                renderMovieList(movies, grid);
                renderHistory();
            } catch (err) {
                grid.innerHTML = `<div class="loading" style="color:#f87171;">সার্ভার কানেক্ট করতে সমস্যা হচ্ছে!</div>`;
            }
        }

        function renderMovieList(movies, container) {
            container.innerHTML = '';
            movies.forEach(movie => {
                const box = createMovieBox(movie);
                container.appendChild(box);
            });
        }

        function createMovieBox(movie) {
            const box = document.createElement('div');
            box.className = 'movie-box';
            box.innerHTML = `
                <div class="movie-poster">
                    🎥
                    <div class="play-overlay">▶</div>
                </div>
                <div class="movie-info">${movie.title}</div>
                <div class="movie-footer">▶ এখনই প্লে করুন</div>
            `;
            box.onclick = () => playMovie(movie.id, movie.title);
            return box;
        }

        function playMovie(msgId, title) {
            document.getElementById('currentTitleinnerHTML').innerHTML = `প্লে হচ্ছে: <span>${title}</span>`;
            const video = document.getElementById('videoPlayer');
            const source = document.getElementById('videoSource');
            
            source.src = `${BACKEND_URL}/stream/${CHANNEL_USERNAME}/${msgId}`;
            video.load();
            video.play().catch(e => console.log("Auto-play prevented:", e));
            
            // Save to Watch History in LocalStorage
            saveToHistory(msgId, title);

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function saveToHistory(msgId, title) {
            let history = JSON.parse(localStorage.getItem('movie_history') || '[]');
            // Remove if already exists to prevent duplicates
            history = history.filter(item => item.id !== msgId);
            // Add to front
            history.unshift({ id: msgId, title: title });
            // Keep max 8 items
            if (history.length > 8) history.pop();
            localStorage.setItem('movie_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const historyGrid = document.getElementById('historyGrid');
            let history = JSON.parse(localStorage.getItem('movie_history') || '[]');

            if (history.length === 0) {
                historyGrid.innerHTML = `<div class="empty-history" id="emptyHistoryMsg">এখনো কোনো মুভি দেখা হয়নি। নিচের বক্স থেকে মুভি সিলেক্ট করুন।</div>`;
                return;
            }

            historyGrid.innerHTML = '';
            history.forEach(movie => {
                const box = createMovieBox(movie);
                historyGrid.appendChild(box);
            });
        }

        loadMovies();
    </script>
</body>
</html>
