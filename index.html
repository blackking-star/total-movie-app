<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total Movie Series - Auto Streaming</title>
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 {
            color: #e50914;
            font-size: 30px;
            margin-bottom: 5px;
        }
        .header p {
            color: #8b949e;
            font-size: 14px;
        }
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }
        .player-section {
            background: #161b22;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            height: fit-content;
        }
        .player-wrapper {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            margin-bottom: 15px;
        }
        .movie-list-section {
            background: #161b22;
            border-radius: 12px;
            padding: 20px;
            max-height: 600px;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .movie-list-section h3 {
            margin-bottom: 15px;
            color: #e50914;
            border-bottom: 1px solid #30363d;
            padding-bottom: 8px;
        }
        .movie-item {
            background: #21262d;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .movie-item:hover {
            background: #30363d;
            transform: translateX(4px);
        }
        .movie-title {
            font-size: 14px;
            font-weight: 500;
            word-break: break-all;
            padding-right: 10px;
        }
        .play-btn-tag {
            background: #e50914;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Total Movie Series</h1>
        <p>টেলিগ্রাম চ্যানেল থেকে অটো-সিলেক্টেড মুভি স্ট্রিমিং অ্যাপ</p>
    </div>

    <div class="main-container">
        <!-- Video Player Section -->
        <div class="player-section">
            <div class="player-wrapper">
                <video id="player" playsinline controls>
                    <source id="videoSource" src="" type="video/mp4" />
                </video>
            </div>
            <h3 id="currentMovieTitle" style="font-size: 15px; color: #fff; margin-top: 10px;">প্লে করার জন্য লিস্ট থেকে যেকোনো মুভিতে ক্লিক করুন</h3>
        </div>

        <!-- Movie List Section -->
        <div class="movie-list-section">
            <h3>চ্যানেলের মুভি লিস্ট</h3>
            <div id="movieListContainer">
                <p style="color: #8b949e; font-size: 14px;">চ্যানেল থেকে মুভি লোড হচ্ছে...</p>
            </div>
        </div>
    </div>

    <!-- Plyr JS -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        const BACKEND_URL = "https://total-movie-backend.onrender.com";
        const CHANNEL_USERNAME = "total_movie_series";

        const player = new Plyr('#player', {
            controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'fullscreen']
        });

        async function fetchMovieList() {
            const container = document.getElementById('movieListContainer');
            try {
                const response = await fetch(`${BACKEND_URL}/api/movies/${CHANNEL_USERNAME}`);
                const movies = await response.json();

                if (movies.error) {
                    container.innerHTML = `<p style="color: #e50914; font-size: 14px;">ত্রুটি: ${movies.error}</p>`;
                    return;
                }

                if (movies.length === 0) {
                    container.innerHTML = `<p style="color: #8b949e; font-size: 14px;">এই চ্যানেলে কোনো ভিডিও পাওয়া যায়নি!</p>`;
                    return;
                }

                container.innerHTML = '';
                movies.forEach(movie => {
                    const item = document.createElement('div');
                    item.className = 'movie-item';
                    item.innerHTML = `
                        <span class="movie-title">${movie.title}</span>
                        <span class="play-btn-tag">প্লে করুন</span>
                    `;
                    item.onclick = () => playMovie(movie.id, movie.title);
                    container.appendChild(item);
                });
            } catch (err) {
                container.innerHTML = `<p style="color: #e50914; font-size: 14px;">সার্ভার কানেক্ট করতে সমস্যা হচ্ছে!</p>`;
            }
        }

        function playMovie(msgId, title) {
            document.getElementById('currentMovieTitle').innerText = "প্লে হচ্ছে: " + title;
            const streamUrl = `${BACKEND_URL}/stream/${CHANNEL_USERNAME}/${msgId}`;
            
            player.source = {
                type: 'video',
                sources: [{ src: streamUrl, type: 'video/mp4' }],
            };
            player.play();
        }

        fetchMovieList();
    </script>
</body>
</html>
